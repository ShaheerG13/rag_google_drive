<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask your Drive</title>
  <style>
    :root {
      color-scheme: light;

      --paper:  #ffffff;
      --panel:  #f7f8f7;
      --ink:    #16181d;
      --muted:  #6a7280;
      --rule:   #e4e7e4;
      --accent: #10614a;
      --accent-dark: #0b4636;
      --accent-tint: #edf4f1;

      --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --font-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 56px 24px 96px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 17px;
      line-height: 1.6;
    }

    .page { max-width: 820px; margin: 0 auto; }

    h1 {
      font-family: var(--font-display);
      font-size: 2.4rem;
      font-weight: 600;
      letter-spacing: -0.015em;
      margin: 0 0 6px;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    form {
      display: flex;
      gap: 10px;
      margin: 36px 0 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px 18px;
      font: inherit;
      font-size: 1.05rem;
      color: inherit;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 10px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder { color: #9aa2a8; }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-tint);
    }

    button {
      padding: 15px 30px;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 500;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: var(--accent-dark); }
    button:disabled { opacity: 0.45; cursor: default; }

    /* Keyboard users get a clear ring, mouse users don't */
    :is(input, button, a):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #answer {
      font-family: var(--font-display);
      font-size: 1.2rem;
      line-height: 1.7;
      white-space: pre-wrap;
      margin-top: 36px;
      padding: 28px 32px;
      background: var(--panel);
      border: 1px solid var(--rule);
      border-radius: 12px;
    }
    /* No answer yet — the empty box would otherwise sit there on page load */
    #answer:empty { display: none; }
    #answer.error { font-family: var(--font-ui); font-size: 1rem; color: #b3261e; }
    #answer.answered { animation: rise 0.3s ease-out; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: none; }
    }

    #status { margin-top: 36px; }
    #status[hidden] { display: none; }

    .status-label {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .track {
      height: 3px;
      background: var(--rule);
      border-radius: 2px;
      overflow: hidden;
    }
    .track::after {
      content: "";
      display: block;
      height: 100%;
      width: 40%;
      background: var(--accent);
      animation: sweep 1.1s ease-in-out infinite;
    }
    @keyframes sweep {
      from { transform: translateX(-100%); }
      to   { transform: translateX(350%); }
    }

    #sources-block { margin-top: 44px; }
    #sources-block[hidden] { display: none; }

    #sources-block h2 {
      font-family: var(--font-ui);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--muted);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--rule);
      margin: 0 0 4px;
    }

    ol { list-style: none; margin: 0; padding: 0; }

    li {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 14px;
      align-items: start;
      padding: 18px 0;
      border-bottom: 1px solid var(--rule);
    }

    /* The number is the point: it matches the [1] the model cites in the answer */
    .marker {
      font-family: var(--font-ui);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-tint);
      border-radius: 6px;
      text-align: center;
      padding: 4px 0;
      margin-top: 2px;
    }

    .source-name {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      overflow-wrap: anywhere;
    }
    .source-name:hover { border-bottom-color: var(--accent); color: var(--accent); }

    .meter {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .meter-track {
      width: 140px;
      max-width: 40%;
      height: 4px;
      background: var(--panel);
      border-radius: 2px;
      overflow: hidden;
    }

    .meter-fill { height: 100%; background: var(--accent); border-radius: 2px; }

    .meter-value {
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      body { padding: 36px 18px 64px; }
      h1 { font-size: 1.9rem; }
      form { flex-direction: column; }
      #answer { padding: 22px 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::after { animation: none !important; transition: none !important; }
      .track::after { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Ask your Drive</h1>
    <p class="subtitle">Answers come only from the files in your folder, with the sources they came from.</p>

    <!-- A form, not a bare button: Enter-to-submit comes free -->
    <form id="ask-form">
      <input id="question" placeholder="What do these documents say about..." autocomplete="off" autofocus />
      <button id="submit" type="submit">Ask</button>
    </form>

    <div id="status" hidden>
      <div class="status-label">Searching your documents...</div>
      <div class="track"></div>
    </div>

    <!-- aria-live: screen readers announce the answer when it lands -->
    <div id="answer" aria-live="polite"></div>

    <section id="sources-block" hidden>
      <h2>Sources</h2>
      <ol id="sources"></ol>
    </section>
  </div>

  <script>
    const form = document.getElementById('ask-form');
    const input = document.getElementById('question');
    const button = document.getElementById('submit');
    const statusEl = document.getElementById('status');
    const answerEl = document.getElementById('answer');
    const sourcesBlock = document.getElementById('sources-block');
    const sourcesEl = document.getElementById('sources');

    function renderSources(sources) {
      sourcesEl.innerHTML = '';

      sources.forEach((source, i) => {
        const li = document.createElement('li');

        const marker = document.createElement('div');
        marker.className = 'marker';
        marker.textContent = i + 1; // matches the [1], [2] the model cites

        const body = document.createElement('div');

        const link = document.createElement('a');
        link.className = 'source-name';
        link.href = source.link;
        link.target = '_blank';
        link.rel = 'noopener';
        // textContent, not innerHTML: file names come from Drive and could otherwise inject markup into the page
        link.textContent = source.name;

        // How close this chunk was to the question — a weak match behind a confident-sounding answer is worth noticing
        const meter = document.createElement('div');
        meter.className = 'meter';

        const track = document.createElement('div');
        track.className = 'meter-track';

        const fill = document.createElement('div');
        fill.className = 'meter-fill';
        fill.style.width = `${Math.round(source.score * 100)}%`;
        track.appendChild(fill);

        const value = document.createElement('span');
        value.className = 'meter-value';
        value.textContent = `${source.score} match`;

        meter.append(track, value);
        body.append(link, meter);
        li.append(marker, body);
        sourcesEl.appendChild(li);
      });

      sourcesBlock.hidden = sources.length === 0;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault(); // stop the browser reloading the page

      const question = input.value.trim();
      if (!question) return;

      button.disabled = true;
      statusEl.hidden = false;
      answerEl.textContent = '';
      answerEl.className = '';
      sourcesBlock.hidden = true;

      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });

        if (!res.ok) throw new Error(`the server returned ${res.status}`);

        const data = await res.json();

        answerEl.className = 'answered';
        answerEl.textContent = data.answer;

        // No sources means nothing cleared the score threshold — the answer already says so, so the section stays hidden
        renderSources(data.sources);
      } catch (err) {
        answerEl.className = 'error';
        answerEl.textContent = `Couldn't get an answer: ${err.message}. Check that the server is still running`;
      } finally {
        statusEl.hidden = true;
        button.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
